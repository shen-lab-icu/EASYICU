<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-labelledby="t d">
  <title id="t">EasyICU workflow</title>
  <desc id="d">A question goes to data, cohort, analysis, manuscript, then PDF and references. Patient-level rows stay local; the model may receive messages, the plan and code, variable names and summary statistics with small counts hidden. Every analysis output is hashed into an evidence store, and the manuscript gate holds back any number without registered evidence.</desc>
  <style>
    .bg { fill: #f7f6f1; }
    .box { fill: #ffffff; stroke: #1f3b34; stroke-width: 1.6; }
    .gate { fill: #e7f2ee; stroke: #1f6b57; stroke-width: 1.6; }
    .title { font: 600 17px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #14211d; }
    .sub { font: 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #4a5a55; }
    .step { font: 600 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f6b57; letter-spacing: .06em; }
    .note { font: 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #14211d; }
    .arrow { stroke: #1f3b34; stroke-width: 1.8; fill: none; marker-end: url(#a); }
    .link { stroke: #1f6b57; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f3b34"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1200" height="330" rx="14"/>

  <g transform="translate(24,40)">
    <rect class="box" width="166" height="134" rx="10"/>
    <text class="step" x="14" y="26">1 · QUESTION</text>
    <text class="title" x="14" y="54">Ask in plain</text>
    <text class="title" x="14" y="76">language</text>
    <text class="sub" x="14" y="102">Copilot conversation</text>
  </g>
  <g transform="translate(220,40)">
    <rect class="box" width="166" height="134" rx="10"/>
    <text class="step" x="14" y="26">2 · DATA</text>
    <text class="title" x="14" y="54">Local ICU data</text>
    <text class="sub" x="14" y="80">Official demo or</text>
    <text class="sub" x="14" y="98">your own export;</text>
    <text class="sub" x="14" y="116">patient rows stay local</text>
  </g>
  <g transform="translate(416,40)">
    <rect class="box" width="166" height="134" rx="10"/>
    <text class="step" x="14" y="26">3 · COHORT</text>
    <text class="title" x="14" y="54">Concepts and</text>
    <text class="title" x="14" y="76">population</text>
    <text class="sub" x="14" y="102">Dictionary mappings</text>
  </g>
  <g transform="translate(612,40)">
    <rect class="box" width="166" height="134" rx="10"/>
    <text class="step" x="14" y="26">4 · ANALYSIS</text>
    <text class="title" x="14" y="54">Reviewed plan,</text>
    <text class="title" x="14" y="76">then compute</text>
    <text class="sub" x="14" y="102">Tables and figures</text>
  </g>
  <g transform="translate(808,40)">
    <rect class="gate" width="166" height="134" rx="10"/>
    <text class="step" x="14" y="26">5 · MANUSCRIPT</text>
    <text class="title" x="14" y="54">Evidence gate</text>
    <text class="sub" x="14" y="80">Numbers bound to</text>
    <text class="sub" x="14" y="98">registered results;</text>
    <text class="sub" x="14" y="116">the rest is held back</text>
  </g>
  <g transform="translate(1004,40)">
    <rect class="box" width="172" height="134" rx="10"/>
    <text class="step" x="14" y="26">6 · DELIVERABLES</text>
    <text class="title" x="14" y="54">PDF and</text>
    <text class="title" x="14" y="76">references (.bib)</text>
    <text class="sub" x="14" y="102">When requested</text>
  </g>

  <path class="arrow" d="M190,107 H218"/>
  <path class="arrow" d="M386,107 H414"/>
  <path class="arrow" d="M582,107 H610"/>
  <path class="arrow" d="M778,107 H806"/>
  <path class="arrow" d="M974,107 H1002"/>

  <rect class="gate" x="416" y="212" width="558" height="44" rx="10"/>
  <text class="note" x="436" y="239">Evidence store: every script, table, statistic and figure is hashed (SHA-256)</text>
  <path class="link" d="M695,174 V210"/>
  <path class="link" d="M891,210 V176"/>

  <text class="note" x="24" y="292">For a paper with its PDF and references, ask for one in your question
    (for example "…, write it up as a paper with PDF and references").</text>
  <text class="sub" x="24" y="314">Patient-level rows stay on your computer; the model may see your messages, the plan and its code, variable names and summary statistics (small counts hidden).</text>
</svg>
