name: Research runner image trust gate

on:
  push:
    paths:
      - "src/easyicu/research_agent/runner_image/**"
      - "src/easyicu/research_agent/execution/kernel_identity.py"
      - "src/easyicu/research_agent/execution/runner.py"
      - "tests/research_agent/execution/test_docker_runner.py"
      - "tests/research_agent/authority/test_execution_kernel_identity.py"
      - ".github/workflows/research_runner_image_ci.yml"
  pull_request:
    paths:
      - "src/easyicu/research_agent/runner_image/**"
      - "src/easyicu/research_agent/execution/kernel_identity.py"
      - "src/easyicu/research_agent/execution/runner.py"
      - "tests/research_agent/execution/test_docker_runner.py"
      - "tests/research_agent/authority/test_execution_kernel_identity.py"
      - ".github/workflows/research_runner_image_ci.yml"

permissions:
  contents: read

concurrency:
  # 2026-08-30: no workflow declared a concurrency group, so a burst of pushes
  # left several full runs (ci.yml medians ~39 min) racing to completion and
  # only the last one mattered. Feature branches and PRs now cancel the run
  # they supersede; main keeps every run so the merge record stays complete.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-smoke-sbom:
    name: Build, isolate, smoke and inventory runner
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out current commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the digest-pinned production runner
        run: |
          docker build \
            --tag easyicu-research-agent:ci \
            --file src/easyicu/research_agent/runner_image/Dockerfile \
            .

      - name: Smoke the production isolation contract
        run: |
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 64 \
            --memory 1g \
            --cpus 1 \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            easyicu-research-agent:ci \
            python -c "import easyicu, numpy, pandas, scipy, sklearn, statsmodels; print('runner-smoke-ok')"

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: easyicu-research-agent:ci
          format: cyclonedx-json
          output-file: easyicu-research-agent.cdx.json
          artifact-name: easyicu-research-agent-sbom
          syft-version: v1.50.0
          upload-release-assets: false
