name: research_agent CI

on:
  push:
    paths:
      - "src/easyicu/research_agent/**"
      - "tests/research_agent/**"
      - "tests/governance/test_arch_measure.py"
      - "tests/governance/test_research_agent_module_graph.py"
      - "tests/governance/test_research_agent_critical_ci.py"
      - "tools/arch_measure.py"
      - "tools/arch_baselines/execution_phase.json"
      - "tools/arch_baselines/research_agent_module_graph.json"
      - "tools/research_agent_module_graph.py"
      - "examples/research_agent_*.py"
      - "pyproject.toml"
      - ".github/workflows/research_agent_ci.yml"
  pull_request:
    paths:
      - "src/easyicu/research_agent/**"
      - "tests/research_agent/**"
      - "tests/governance/test_arch_measure.py"
      - "tests/governance/test_research_agent_module_graph.py"
      - "tests/governance/test_research_agent_critical_ci.py"
      - "tools/arch_measure.py"
      - "tools/arch_baselines/execution_phase.json"
      - "tools/arch_baselines/research_agent_module_graph.json"
      - "tools/research_agent_module_graph.py"
      - "examples/research_agent_*.py"
      - "pyproject.toml"
      - ".github/workflows/research_agent_ci.yml"

permissions:
  contents: read

concurrency:
  # 2026-08-30: no workflow declared a concurrency group, so a burst of pushes
  # left several full runs (ci.yml medians ~39 min) racing to completion and
  # only the last one mattered. Feature branches and PRs now cancel the run
  # they supersede; main keeps every run so the merge record stays complete.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# This gate checks the explicitly installed runtime on supported Python versions.
# Lower-bound requirements let pip resolve a compatible current combination;
# they do not test the lowest supported versions. Preserve the actual resolved
# environment in the receipts instead of claiming a minimum-version matrix.
jobs:
  architecture:
    name: research_agent architecture
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install architecture test dependency
        run: python -m pip install "pytest>=7.0"

      - name: Enforce execution-phase architecture ratchet
        run: python tools/arch_measure.py --diff tools/arch_baselines/execution_phase.json

      - name: Enforce research-agent module graph ratchet
        if: ${{ !cancelled() }}
        run: >-
          python tools/research_agent_module_graph.py
          --diff tools/arch_baselines/research_agent_module_graph.json

      - name: Run architecture contract tests
        if: ${{ !cancelled() }}
        run: pytest tests/governance/test_arch_measure.py tests/governance/test_research_agent_module_graph.py -q -m ""

  test:
    name: research_agent tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install research_agent runtime dependencies
        run: |
          python -m pip install --upgrade pip
          # Keep this explicit so missing package metadata cannot silently
          # hide an import required by the agent test collection.
          # FLOORS MUST NOT DROP BELOW pyproject.toml's [project.dependencies]:
          # a lower floor here lets CI pass on a version the package forbids.
          # tests/governance/test_ci_dependency_floors.py locks the two together.
          pip install \
            "pandas>=1.5" \
            "openpyxl>=3.1" \
            "pyarrow>=23.0.0" \
            "numpy>=1.23" \
            "pydantic>=2.0" \
            "matplotlib>=3.7" \
            "requests>=2.28" \
            "tqdm>=4.65" \
            "duckdb>=0.9.0" \
            "scipy>=1.10" \
            "typing-extensions>=4.8" \
            "pytest>=7.0" \
            "pytest-xdist>=3.0" \
            "pyyaml>=6.0" \
            "scikit-learn>=1.3" \
            "statsmodels>=0.14" \
            "patsy>=0.5.6" \
            "packaging>=23.0" \
            "Send2Trash>=1.8" \
            "cryptography>=42.0" \
            "openai>=1.40.0" \
            "mcp>=1.28,<2" \
            "fastapi>=0.115" \
            "tomli>=2.0; python_version < '3.11'"
          # Editable install of the easyicu package without extras so
          # import easyicu.research_agent succeeds.
          pip install --no-deps -e .

      - name: Compile Python source and tests
        run: python -m compileall -q src tests

      - name: Record the tested candidate and resolved runtime
        run: |
          mkdir -p ci-receipts
          git rev-parse HEAD > ci-receipts/commit-sha.txt
          python --version > ci-receipts/python-version.txt
          python -m pip freeze --all > ci-receipts/resolved-requirements.txt

      - name: Run named critical regressions without keyword filtering
        shell: bash
        run: |
          mapfile -t critical_tests < tests/research_agent/critical_regressions.txt
          test "${#critical_tests[@]}" -gt 0
          printf '%s\n' "${critical_tests[@]}" > ci-receipts/critical-files.txt
          pytest "${critical_tests[@]}" -q -m "" --collect-only > ci-receipts/critical-collected-tests.txt
          pytest "${critical_tests[@]}" -q -m "" --junitxml=ci-receipts/critical-results.xml

      - name: Run research_agent functional contract suite
        run: |
          # Keep fail-closed runner policy tests in their default environment.
          pytest tests/research_agent/execution/test_runner.py -q -m ""
          # This keyword-selected suite checks import health and typed contracts
          # under the resolved runtime. Named critical regressions run separately
          # above; exhaustive behaviour coverage remains in ci.yml.
          python -c "import easyicu.research_agent as m; print('import OK', m.__name__)"
          EASYICU_TEST_RUNNER_KIND=subprocess \
          EASYICU_ALLOW_UNSAFE_HOST_FALLBACK=1 \
            pytest tests/research_agent -q -m "" -n auto --dist loadfile \
              -k "contract or boundary or package or schema or import" \
              --ignore=tests/research_agent/execution/test_runner.py \
              --junitxml=ci-receipts/functional-results.xml

      - name: Preserve candidate, collection and execution receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: research-agent-receipts-py${{ matrix.python-version }}-${{ github.sha }}
          path: ci-receipts/
          retention-days: 30

  # The explicit runtime in the `test` job above intentionally
  # has no `anthropic`, so tests/research_agent/providers/test_anthropic_messages_client.py
  # importorskips there. That skip is only safe while some job still exercises
  # the real adapter -- otherwise CI goes green while the native Claude
  # Messages transport is never tested at all. This job is that guarantee: it
  # installs the `agentic` extra, ASSERTS the SDK actually imports (so the
  # importorskip can never quietly swallow the whole file), and then runs the
  # adapter tests. tests/governance/test_repository_contract.py locks this job in place.
  anthropic-adapter:
    name: anthropic adapter (agentic extra)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install EasyICU with the agentic extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,agentic]"

      - name: Assert the optional Anthropic SDK is present
        run: |
          # Fail loudly here rather than let importorskip turn a missing extra
          # into a silent skip inside the test run below.
          python -c "import anthropic; print('anthropic', anthropic.__version__)"

      - name: Run the native Anthropic adapter tests
        run: |
          pytest tests/research_agent/providers/test_anthropic_messages_client.py -q -m ""
