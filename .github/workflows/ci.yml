name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install EasyICU and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,webapp]"
          # research_agent tests need these but they are not declared in any
          # pyproject extra; install explicitly so the full suite can run.
          pip install "scikit-learn>=1.3" "statsmodels>=0.14"

      - name: Run lint gate
        run: ruff check src tests

      - name: Run test suite
        run: pytest -q
