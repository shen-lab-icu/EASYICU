name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install EasyICU and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,webapp]"

      - name: Run lint gate
        run: ruff check src tests

      - name: Build pinned research-agent runner image
        run: |
          docker build \
            -t easyicu-research-agent:1.0.0 \
            -f src/easyicu/research_agent/runner_image/Dockerfile \
            .
          docker image inspect easyicu-research-agent:1.0.0 >/dev/null

      - name: Run test suite
        run: pytest -q
