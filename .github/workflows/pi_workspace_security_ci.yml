name: Pi workspace security CI

on:
  push:
    paths:
      - "src/easyicu/webserver/pi_copilot/**"
      - "src/easyicu/webserver/routes/pi_copilot.py"
      - "src/easyicu/webserver/agent_runs.py"
      - "src/easyicu/webserver/static/css/guided-pi*.css"
      - "src/easyicu/webserver/static/js/screens-guided-pi*.js"
      - "src/easyicu/webserver/static/js/screens-agent-render.js"
      - "src/easyicu/webserver/static/index.html"
      - "tests/test_pi_copilot_*.py"
      - "tests/js/agent_render_security.test.js"
      - "tools/qa_pi_workspace_preview_security.py"
      - "tools/qa_native_fastapi_patient_drilldown.py"
      - ".github/workflows/pi_workspace_security_ci.yml"
  pull_request:
    paths:
      - "src/easyicu/webserver/pi_copilot/**"
      - "src/easyicu/webserver/routes/pi_copilot.py"
      - "src/easyicu/webserver/agent_runs.py"
      - "src/easyicu/webserver/static/css/guided-pi*.css"
      - "src/easyicu/webserver/static/js/screens-guided-pi*.js"
      - "src/easyicu/webserver/static/js/screens-agent-render.js"
      - "src/easyicu/webserver/static/index.html"
      - "tests/test_pi_copilot_*.py"
      - "tests/js/agent_render_security.test.js"
      - "tools/qa_pi_workspace_preview_security.py"
      - "tools/qa_native_fastapi_patient_drilldown.py"
      - ".github/workflows/pi_workspace_security_ci.yml"

permissions:
  contents: read

jobs:
  scoped-security-gate:
    name: Pi workspace scoped security gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out current commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install EasyICU and browser test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,webapp]" playwright
          python -m playwright install --with-deps chromium

      - name: Run scoped Pi contract tests
        run: |
          pytest -q \
            tests/test_pi_copilot_routes.py \
            tests/test_pi_copilot_workspace.py \
            tests/test_pi_copilot_contract.py \
            tests/test_pi_copilot_static.py \
            tests/test_pi_copilot_gateway.py \
            tests/test_pi_copilot_provider_config.py \
            tests/test_pi_copilot_install.py \
            tests/test_pi_copilot_multiprocess_locking.py \
            tests/test_pi_copilot_security_workflow.py

      - name: Parse-check Pi sidecar owners
        if: ${{ !cancelled() }}
        run: |
          node --check src/easyicu/webserver/pi_copilot/node_app/src/main.mjs
          node --check src/easyicu/webserver/pi_copilot/node_app/src/event-projection.mjs
          node --check src/easyicu/webserver/pi_copilot/node_app/src/shell-budget.mjs

      - name: Run research artifact renderer security vectors
        if: ${{ !cancelled() }}
        run: |
          node tests/js/agent_render_security.test.js \
            src/easyicu/webserver/static/js/screens-agent-render.js

      - name: Prove hostile preview origin isolation in Chromium
        if: ${{ !cancelled() }}
        run: python tools/qa_pi_workspace_preview_security.py
