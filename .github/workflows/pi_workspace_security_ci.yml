name: Pi workspace security CI

on:
  push:
    paths:
      - "src/easyicu/webserver/pi_copilot/**"
      - "src/easyicu/webserver/routes/pi_copilot.py"
      - "src/easyicu/webserver/routes/agent.py"
      - "src/easyicu/webserver/agent_runs.py"
      - "src/easyicu/webserver/agent_pipeline_runs.py"
      - "src/easyicu/webserver/figure_presentation.py"
      - "src/easyicu/webserver/dataio.py"
      - "src/easyicu/webserver/primary_cohort.py"
      - "src/easyicu/webserver/study_contexts.py"
      - "src/easyicu/webserver/static/css/guided-pi*.css"
      - "src/easyicu/webserver/static/js/api.js"
      - "src/easyicu/webserver/static/js/screens-guided-pi*.js"
      - "src/easyicu/webserver/static/js/screens-agent-render.js"
      - "src/easyicu/webserver/static/index.html"
      - "tests/webserver/copilot/test_pi_copilot_*.py"
      - "tests/webserver/test_web_cohort_exclusion_binding.py"
      - "tests/webserver/test_agent_run_artifact_privacy.py"
      - "tests/webserver/test_web_figure_presentation_overlay.py"
      - "tests/js/*.test.js"
      - "tools/run_js_contracts.py"
      - "tools/qa_pi_workspace_preview_security.py"
      - "tools/qa_native_fastapi_patient_drilldown.py"
      - ".github/workflows/pi_workspace_security_ci.yml"
  pull_request:
    paths:
      - "src/easyicu/webserver/pi_copilot/**"
      - "src/easyicu/webserver/routes/pi_copilot.py"
      - "src/easyicu/webserver/routes/agent.py"
      - "src/easyicu/webserver/agent_runs.py"
      - "src/easyicu/webserver/agent_pipeline_runs.py"
      - "src/easyicu/webserver/figure_presentation.py"
      - "src/easyicu/webserver/dataio.py"
      - "src/easyicu/webserver/primary_cohort.py"
      - "src/easyicu/webserver/study_contexts.py"
      - "src/easyicu/webserver/static/css/guided-pi*.css"
      - "src/easyicu/webserver/static/js/api.js"
      - "src/easyicu/webserver/static/js/screens-guided-pi*.js"
      - "src/easyicu/webserver/static/js/screens-agent-render.js"
      - "src/easyicu/webserver/static/index.html"
      - "tests/webserver/copilot/test_pi_copilot_*.py"
      - "tests/webserver/test_web_cohort_exclusion_binding.py"
      - "tests/webserver/test_agent_run_artifact_privacy.py"
      - "tests/webserver/test_web_figure_presentation_overlay.py"
      - "tests/js/*.test.js"
      - "tools/run_js_contracts.py"
      - "tools/qa_pi_workspace_preview_security.py"
      - "tools/qa_native_fastapi_patient_drilldown.py"
      - ".github/workflows/pi_workspace_security_ci.yml"

permissions:
  contents: read

jobs:
  scoped-security-gate:
    name: Pi workspace scoped security gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out current commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install EasyICU and browser test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,webapp]" playwright
          python -m playwright install --with-deps chromium

      - name: Compile Python source and tests
        run: python -m compileall -q src tests

      - name: Run scoped Pi contract tests
        run: |
          # Auto-discover every Pi Copilot owner test so a new contract file
          # cannot exist in the repository while remaining invisible to CI.
          pytest -q -m "" \
            tests/webserver/copilot/test_pi_copilot_*.py \
            tests/webserver/test_web_cohort_exclusion_binding.py \
            tests/webserver/test_agent_run_artifact_privacy.py \
            tests/webserver/test_web_figure_presentation_overlay.py

      - name: Parse-check Pi sidecar owners
        if: ${{ !cancelled() }}
        run: |
          node --check src/easyicu/webserver/pi_copilot/node_app/src/main.mjs
          node --check src/easyicu/webserver/pi_copilot/node_app/src/event-projection.mjs
          node --check src/easyicu/webserver/pi_copilot/node_app/src/shell-budget.mjs
          node --check src/easyicu/webserver/static/js/api.js
          node --check src/easyicu/webserver/static/js/screens-guided-pi.js
          node --check src/easyicu/webserver/static/js/screens-guided-pi-cohort-eligibility.js

      - name: Run JavaScript owner and security contracts
        if: ${{ !cancelled() }}
        run: python tools/run_js_contracts.py

      - name: Prove hostile preview origin isolation in Chromium
        if: ${{ !cancelled() }}
        run: python tools/qa_pi_workspace_preview_security.py
