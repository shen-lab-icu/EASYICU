# Streamlit 配置文件 - 防止休眠和超时

[server]
# 默认端口
port = 8501

# 无头模式运行
headless = true

# 启用 CORS
enableCORS = false
enableXsrfProtection = false

# 禁用文件监视器（减少资源占用）
fileWatcherType = "none"

# 增加连接超时时间（秒）
maxUploadSize = 200

# 允许的最大消息大小（MB）
maxMessageSize = 200

# 🔧 FIX (2026-02-20): WebSocket 保活配置
# 启用 WebSocket 压缩（减少带宽）
enableWebsocketCompression = true

# WebSocket ping 间隔（秒）— 保持连接活跃
# 注意：浏览器端也有超时，Streamlit需要主动ping
# 设为0由应用层通过线程keepalive保活
# 不设置此项让 Streamlit 使用默认值（如果有的话）

# 断连后会话保活时间（秒）— 设为1小时防止长任务中断
disconnectedSessionTTL = 3600

[browser]
# 禁止自动打开浏览器
serverAddress = "localhost"
gatherUsageStats = false

[runner]
# 禁用魔术命令（提高性能）
magicEnabled = false

# 快速重新运行
fastReruns = true

[client]
# 显示错误详情
showErrorDetails = true

[theme]
# 🔧 FIX: 强制浅色主题 — 防止 Windows 暗色系统下 Streamlit 自动切换暗色
base = "light"
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#f1f5f9"
textColor = "#0f172a"
primaryColor = "#6366f1"
font = "sans serif"

# 工具栏模式
toolbarMode = "minimal"
