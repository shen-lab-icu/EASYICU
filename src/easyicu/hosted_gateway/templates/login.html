<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>登录 · EasyICU</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='12' fill='%230E1116'/%3E%3Cpath d='M12 5l1.5 4.4L18 11l-4.5 1.6L12 17l-1.5-4.4L6 11l4.5-1.6z' fill='%23fff'/%3E%3C/svg%3E">
<style>
  /* Self-contained: the hospital network may block font and script hosts,
     and clinicians use whatever browser their workstation has. Colours
     follow EasyICU's tokens (css/tokens.css) as plain hex. */
  :root {
    --bg: #FAFAF7; --surface: #FFFFFF; --ink: #0E1116; --ink-2: #2E3338;
    --ink-3: #56606C; --ink-4: #667085; --hair: #E7E5DF;
    --accent: #2E7A86; --accent-ink: #1F5560; --accent-soft: #EEF6F7;
    --bad: #A3302A; --bad-soft: #FBEFEE;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 16px; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 360px; }
  .brand { display: flex; align-items: center; gap: 10px; margin: 0 0 22px 2px; }
  .mark {
    flex: none; display: grid; place-items: center; width: 36px; height: 36px;
    border-radius: 50%; background: var(--ink); color: #fff;
  }
  .brand strong { display: block; font-size: 17px; letter-spacing: -0.01em; }
  .brand span { display: block; font-size: 12.5px; color: var(--ink-3); }
  .card {
    background: var(--surface); border: 1px solid var(--hair); border-radius: 10px;
    padding: 26px 24px 22px; box-shadow: 0 4px 12px rgba(14, 17, 22, 0.06), 0 1px 0 rgba(14, 17, 22, 0.04);
  }
  h1 { margin: 0 0 4px; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
  .lead { margin: 0 0 20px; color: var(--ink-3); font-size: 13px; }
  label { display: block; margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
  input[type="text"], input[type="password"] {
    display: block; width: 100%; height: 40px; margin: 0 0 16px; padding: 0 12px;
    border: 1px solid var(--hair); border-radius: 6px; background: var(--surface);
    color: var(--ink); font: inherit; font-size: 15px;
  }
  input[type="text"]:focus, input[type="password"]:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .error {
    margin: 0 0 16px; padding: 10px 12px; border-radius: 6px;
    background: var(--bad-soft); color: var(--bad); font-size: 13px;
  }
  .error:empty { display: none; }
  button {
    display: block; width: 100%; height: 42px; margin-top: 4px; border: 0; border-radius: 6px;
    background: var(--accent); color: #fff; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: var(--accent-ink); }
  button:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 2px; }
  .help { margin: 18px 2px 0; color: var(--ink-4); font-size: 12.5px; }
  .help p { margin: 0 0 4px; }
  /* The workspace needs Chrome/Edge 105+ (it draws older theme colours
     itself). IE, 360's compatibility mode and older cores ignore this
     @supports rule and keep the note; plain hex because IE has no var(). */
  .browser-note {
    margin: 0 0 16px; padding: 12px 14px; border: 1px solid #E8D3A6; border-radius: 8px;
    background: #FBF4E6; color: #6B4A12; font-size: 13px;
  }
  .browser-note strong { display: block; margin-bottom: 2px; color: #4F360B; }
  .browser-note p { margin: 0; }
  @supports selector(:has(a)) { .browser-note { display: none; } }
</style>
</head>
<body>
<main>
  <div class="brand">
    <div class="mark" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>
    </div>
    <div><strong>EasyICU</strong><span>ICU 研究工作台</span></div>
  </div>
  <div class="browser-note" role="note" data-browser-note>
    <strong>当前浏览器版本较旧，或处于兼容模式</strong>
    <p>登录后部分页面可能无法正常显示。请用新版 Chrome 或 Edge 打开这个地址；用 360 等双核浏览器时，请点地址栏右侧的图标，切换到「极速模式」。</p>
  </div>
  <div class="card">
    <h1>登录</h1>
    <p class="lead">使用管理员分配的账号登录。</p>
    <form method="post" action="/login" autocomplete="on">
      <input type="hidden" name="csrf" value="{{csrf}}">
      <p class="error" role="alert">{{error}}</p>
      <label for="username">用户名</label>
      <input id="username" name="username" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" required autofocus>
      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">登录</button>
    </form>
  </div>
  <div class="help">
    <p>忘记密码或无法登录，请联系管理员。</p>
    <p>仅限本院授权人员使用。</p>
    <p>研究结果仅用于科研，不替代临床判断。</p>
  </div>
</main>
</body>
</html>
