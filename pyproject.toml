[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easyicu"
version = "1.0.0"
description = "Python toolkit for working with ICU datasets inspired by the R ricu package."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Haibo Zhu and EasyICU contributors" }
]
license = { text = "MIT" }
dependencies = [
  "pandas>=1.5",
  "openpyxl>=3.1",
  "pyarrow>=23.0.0",
  "numpy>=1.23",
  "matplotlib>=3.7",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "requests>=2.28",
  "tqdm>=4.65",
  "duckdb>=0.9.0",
  "scikit-learn>=1.3",
  "statsmodels>=0.14"
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "black>=23.0",
  "ruff>=0.1.0"
]
viz = [
  "plotly>=5.15",
  "kaleido>=0.2.1"
]
webapp = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "psutil>=5.9",
  "openai>=1.0"
]
llmserver = [
  "fastapi>=0.115",
  "uvicorn>=0.30"
]
agentic = [
  "langgraph>=1.0"
]
# Advanced analytical methods the research-agent sandbox may use. Mirrors
# research_agent/method_capabilities.CURATED_METHOD_PACKAGES — the coder is only
# allowed to import a package once it is declared here (reproducible) AND
# importable at run time (verified by the capability probe).
methods = [
  "lifelines>=0.27",
  "shap>=0.44",
  "xgboost>=2.0"
]
all = [
  "easyicu[dev,viz,webapp,llmserver,agentic,methods]"
]

[project.scripts]
easyicu = "easyicu.scripts.extract_features:main"
easyicu-webapp = "easyicu.webserver.__main__:main"
easyicu-llm-server = "easyicu.hosted_llm_server:main"
easyicu-research-agent = "easyicu.research_agent.cli:main"
easyicu-research-replication = "easyicu.research_agent.replication_cli:main"

[project.urls]
Homepage = "https://github.com/shen-lab-icu/easyicu"
Repository = "https://github.com/shen-lab-icu/easyicu.git"
Issues = "https://github.com/shen-lab-icu/easyicu/issues"
Documentation = "https://github.com/shen-lab-icu/easyicu/blob/main/README.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
easyicu = ["data/*.json"]
"easyicu.webserver" = [
  "static/index.html",
  "static/css/*.css",
  "static/js/*.js"
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Keep the first project-wide gate conservative while the historical lint
# backlog is retired. This mirrors Ruff's default error-focused families.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Public re-export surface and large transition modules retain compatibility
# imports that are intentionally not referenced inside the defining module.
"src/easyicu/__init__.py" = ["E402", "F401", "F822"]
"src/easyicu/research_agent/__init__.py" = ["E402", "F401", "F822"]
"src/easyicu/research_agent/*.py" = ["E402", "F401", "F841"]
"src/easyicu/research_agent/**/*.py" = ["E402", "F401", "F841"]
"src/easyicu/research_agent/pipeline.py" = ["E402", "F401", "F541"]
# Legacy compact callback/specification files are tracked as lint debt rather
# than reformatted in this behaviour-preserving research-agent cleanup pass.
# 2026-07-03: paths re-mapped after the flat modules moved into subpackages
# (concept/, scores/, io/, utils/, runtime/); entries whose debt was actually
# fixed in that pass (F841 dead assignments, E731, F821) were dropped instead
# of re-ignored.
"src/easyicu/api.py" = ["E401", "E402", "E701", "F401", "F811", "F841"]
"src/easyicu/cohort_visualization.py" = ["F401"]
"src/easyicu/concept/__init__.py" = ["E402", "E701", "F401"]
"src/easyicu/concept/callbacks.py" = ["E402"]
"src/easyicu/config.py" = ["E402"]
"src/easyicu/datasource.py" = ["E402", "E701", "F401", "F841"]
"src/easyicu/easy.py" = ["E402"]
"src/easyicu/io/export.py" = ["F401"]
"src/easyicu/scores/__init__.py" = ["E701"]
"src/easyicu/scripts/extract_features.py" = ["E701", "F401", "F841"]
"src/easyicu/visualization/*.py" = ["E741", "F401"]
"tests/**/*.py" = ["E402", "E702", "E741", "F401", "F841"]
"tests/research_agent/test_cost.py" = ["F811"]
"tests/research_agent/test_skills.py" = ["F821"]
"tests/research_agent/test_validators.py" = ["F821"]
