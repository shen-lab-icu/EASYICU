[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easyicu"
version = "1.0.0"
description = "Python toolkit for working with ICU datasets inspired by the R ricu package."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Haibo Zhu and EasyICU contributors" }
]
license = "MIT"
dependencies = [
  "pandas>=1.5",
  "openpyxl>=3.1",
  "pyarrow>=23.0.0",
  "numpy>=1.23",
  "matplotlib>=3.7",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "requests>=2.28",
  "tqdm>=4.65",
  "duckdb>=0.9.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
  "patsy>=0.5.6",
  "packaging>=23.0",
  "typing-extensions>=4.8",
  "cryptography>=42.0",
  "Send2Trash>=1.8"
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=7.0",
  "pytest-xdist>=3.0",
  "pytest-cov>=4.0",
  "black>=23.0",
  "ruff>=0.1.0",
  "vulture>=2.14",
  "deptry>=0.23",
  "import-linter>=2.13",
  "httpx>=0.27",
  "mcp>=1.28,<2",
  # tests/ read pyproject with tomllib, which is stdlib only from 3.11.
  # requires-python allows 3.10, where three test modules imported it
  # unconditionally and failed the whole matrix leg at collection.
  "tomli>=2.0; python_version < '3.11'"
]
viz = [
  "plotly>=5.15",
  "kaleido>=0.2.1"
]
webapp = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "psutil>=5.9",
  "anthropic>=0.119.0",
  "openai>=1.40.0",
  "starlette>=0.40",
  "pymupdf>=1.24"
]
llmserver = [
  "fastapi>=0.115",
  "uvicorn>=0.30"
]
agentic = [
  "httpx>=0.27",
  "anthropic>=0.119.0",
  "openai>=1.40.0",
  "pillow>=10.0",
  "pypdf>=5.0"
]
mcp = [
  "mcp>=1.28,<2",
  "anyio>=4.5",
  "starlette>=0.40",
  "uvicorn>=0.31"
]
cli = [
  "rich>=13.0"
]
# Advanced analytical methods the research-agent sandbox may use. Mirrors
# research_agent/contracts/method_packages.CURATED_METHOD_PACKAGES — the coder is only
# allowed to import a package once it is declared here (reproducible) AND
# importable at run time (verified by the capability probe).
methods = [
  "lifelines>=0.27",
  "numba>=0.59",
  "shap>=0.44",
  "xgboost>=2.0"
]
# Optional adapters are deliberately separate from ``methods``: installing one
# does not advertise it to the Coder or promote a scientific capability.  It
# must still pass the capability-request / immutable-image approval path.
scientific-adapters = [
  "pandera[pandas]>=0.28,<0.33",
  "dowhy>=0.13,<0.14",
  "scikit-survival>=0.28,<0.29; python_version >= '3.11'"
]
all = [
  "easyicu[dev,viz,webapp,llmserver,agentic,mcp,cli,methods]"
]

[project.scripts]
easyicu = "easyicu.scripts.extract_features:main"
easyicu-webapp = "easyicu.webserver.__main__:main"
easyicu-llm-server = "easyicu.hosted_llm_server:main"
easyicu-research-agent = "easyicu.research_agent.cli:main"
easyicu-research-replication = "easyicu.research_agent.replication_cli:main"
easyicu-copilot-install = "easyicu.webserver.pi_copilot.install:main"

[project.urls]
Homepage = "https://github.com/shen-lab-icu/easyicu"
Repository = "https://github.com/shen-lab-icu/easyicu.git"
Issues = "https://github.com/shen-lab-icu/easyicu/issues"
Documentation = "https://github.com/shen-lab-icu/easyicu/blob/main/README.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
easyicu = ["data/*.json", "data/research_know_how/*.json"]
"easyicu.webserver" = [
  "static/index.html",
  "static/THIRD_PARTY_NOTICES.md",
  "static/css/*.css",
  "static/js/*.js",
  "static/assets/demo/*.png",
  "static/assets/demo/*.html",
  "static/assets/demo/*.pdf",
  "static/vendor/echarts/*",
  "pi_copilot/tool_catalog.json",
  "pi_copilot/node_app/package.json",
  "pi_copilot/node_app/package-lock.json",
  "pi_copilot/node_app/README.md",
  "pi_copilot/node_app/THIRD_PARTY_NOTICES.md",
  "pi_copilot/node_app/src/main.mjs",
  "pi_copilot/node_app/src/event-projection.mjs",
  "pi_copilot/node_app/src/post-tool-finalization.mjs",
  "pi_copilot/node_app/src/shell-budget.mjs",
  "pi_copilot/node_app/src/session-lifecycle.mjs",
  "pi_copilot/node_app/src/skills/web-prototype/SKILL.md"
]
"easyicu.research_agent.providers.prompts" = ["v1/*.txt", "v2/*.txt"]
# The DockerRunner docstring tells users to build the sandbox image from
# src/easyicu/research_agent/runner_image/Dockerfile. Ship it, or that
# instruction is dead for anyone who installed from a wheel.
"easyicu.research_agent" = [
  "runner_image/Dockerfile",
  "runner_image/requirements.lock",
  "runner_image/README.md",
]

[tool.ruff]
target-version = "py310"

[tool.deptry]
# Optional feature groups and developer tools are intentionally not imported
# by the production package. Missing and transitive runtime dependencies remain
# hard failures; only the "declared but unused" report is suppressed.
ignore = ["DEP002"]

[tool.deptry.package_module_name_map]
# These distributions intentionally expose a differently named import package.
# Keep the mapping explicit so DEP001 remains a real missing-dependency gate.
pyyaml = "yaml"
pillow = "PIL"
"scikit-learn" = "sklearn"
pymupdf = "fitz"

[tool.ruff.lint]
# The first project-wide gate was Ruff's default error-focused families while
# the historical lint backlog was retired. It has been widened to add the two
# families that catch defects this project actually cares about:
#
#   B — flake8-bugbear: real bugs, not style.
#   S — flake8-bandit: the security lane.
#
# Widening them wholesale would have meant a ~700-line sweep across hundreds of
# files, which is exactly the broad refactor CONTRIBUTING tells us not to do.
# So each family is enabled with today's backlog pinned in `ignore` below. The
# point is the ratchet: every *other* rule in B and S is now enforced, so a new
# `eval`, `exec`, `shell=True`, `verify=False`, or `yaml.load` cannot land
# unnoticed, and each ignored rule can be retired one at a time in its own
# reviewable commit.
select = ["E4", "E7", "E9", "F", "B", "S"]

ignore = [
    # --- deliberate, not backlog ------------------------------------------
    # `assert` in library code. Audited 2026-09-02: every one narrows a type
    # behind a pydantic model validator or an `if ... raise` immediately above
    # it. Verified empirically too — the 11,248-test research-agent suite run
    # under PYTHONOPTIMIZE=1 (all asserts stripped) produces a byte-identical
    # failure set. None of them is a fail-closed gate.
    "S101",
    # Suspicious URL open. All 18 sites use pinned literal hosts (NCBI
    # eutils, PhysioNet with a pinned redirect handler, Tavily).
    "S310",
    # "Hardcoded password". All 10 are parse tokens and environment variable
    # *names*, not values.
    "S105",
    # Subprocess without shell=True. The step runner deliberately builds
    # argument vectors and never passes a shell string.
    "S603",
    "S607",

    # --- backlog, pinned; retire one rule per commit ----------------------
    "B905",  # 187 — zip() without an explicit strict=
    "B023",  # 45  — closures over a loop variable; audited, all are invoked
             #       within the same iteration, so none currently misfires
    "B008",  # 38  — function call in a default argument
    "B007",  # 31  — unused loop control variable
    "B904",  # 24  — raise without `from` inside except; hurts diagnosability
    "B028",  # 3   — warnings.warn without stacklevel
    "S110",  # 133 — try/except/pass. This is the silent-swallow pattern the
             #       2026-09 audit is about; retiring it is its own project.
    "S112",  # 82  — try/except/continue, same family
    "S608",  # 54  — SQL built by string interpolation (DuckDB, internal)
    "S324",  # 9   — sha1/md5 used as content keys, not as a MAC
    "S314",  # 6   — ElementTree on PubMed responses
    "S108",  # 5   — literal /tmp in the sandbox subprocess environment
    "S311",  # 2   — random used for sampling, not for secrets
    "S301",  # 2   — the two sanctioned pickle sites, both opt-in gated
    "S104",  # 1   — a comparison against "0.0.0.0", not a bind
    "S106",  # 1   — an argument named `token` that carries a receipt id
]

[tool.ruff.lint.per-file-ignores]
# Public re-export surface and large transition modules retain compatibility
# imports that are intentionally not referenced inside the defining module.
"src/easyicu/__init__.py" = ["E402", "F401", "F822"]
"src/easyicu/research_agent/__init__.py" = ["E402", "F401", "F822"]
"src/easyicu/research_agent/*.py" = ["E402"]
"src/easyicu/research_agent/**/*.py" = ["E402"]
# Historical F401/F841 debt is pinned to the exact files that contain it.
# New research-agent files receive both rules automatically.
"src/easyicu/research_agent/agents/core.py" = ["F401", "F841"]
"src/easyicu/research_agent/audits/patterns.py" = ["F401"]
"src/easyicu/research_agent/audits/validators.py" = ["F401", "F841"]
"src/easyicu/research_agent/authority/provenance.py" = ["F401"]
"src/easyicu/research_agent/authority/run_lock.py" = ["B010"]
"src/easyicu/research_agent/authority/step_runtime.py" = ["F401"]
"src/easyicu/research_agent/authority/typed_input_receipt.py" = ["F401"]
"src/easyicu/research_agent/case_plugins/builder.py" = ["F401"]
"src/easyicu/research_agent/cohort/schema.py" = ["F401"]
"src/easyicu/research_agent/contracts/declared_product.py" = ["F401"]
"src/easyicu/research_agent/contracts/table_one.py" = ["F401"]
"src/easyicu/research_agent/discovery/idea_mining.py" = ["F401"]
"src/easyicu/research_agent/execution/code_hygiene.py" = ["F401"]
"src/easyicu/research_agent/execution/development_sample.py" = ["F401", "F841"]
"src/easyicu/research_agent/execution/phase.py" = ["F401"]
"src/easyicu/research_agent/execution/runners/deterministic_descriptive.py" = ["F401"]
"src/easyicu/research_agent/figures/causal.py" = ["F401"]
"src/easyicu/research_agent/figures/phenotype.py" = ["F401"]
"src/easyicu/research_agent/figures/prediction.py" = ["F401"]
"src/easyicu/research_agent/gates/preflight.py" = ["F401"]
"src/easyicu/research_agent/learning/runtime.py" = ["F401"]
"src/easyicu/research_agent/orchestration/experiment_spec.py" = ["F401"]
"src/easyicu/research_agent/pipeline.py" = ["F401", "F541", "F841"]
"src/easyicu/research_agent/providers/llm.py" = ["F401"]
"src/easyicu/research_agent/providers/mocks.py" = ["F401", "F841"]
"src/easyicu/research_agent/repairs/serialization.py" = ["F841"]
"src/easyicu/research_agent/repairs/source.py" = ["F401"]
"src/easyicu/research_agent/replication/notebook.py" = ["F401"]
"src/easyicu/research_agent/replication/paper.py" = ["F841"]
"src/easyicu/research_agent/reporting/bibtex.py" = ["F401"]
"src/easyicu/research_agent/reporting/latex.py" = ["F401"]
"src/easyicu/research_agent/reporting/reporting_checklist.py" = ["F401"]
"src/easyicu/research_agent/reporting/reviewer.py" = ["F401", "F841"]
"src/easyicu/research_agent/research_context/builder.py" = ["F401"]
"src/easyicu/research_agent/research_context/prompt_scope.py" = ["F401"]
"src/easyicu/research_agent/research_context/typed.py" = ["F401"]
"src/easyicu/research_agent/resources/capability.py" = ["F401"]
"src/easyicu/research_agent/resources/coder.py" = ["F401"]
"src/easyicu/research_agent/robustness/panel.py" = ["F401"]
"src/easyicu/research_agent/robustness/primary_effect.py" = ["F401"]
# Legacy compact callback/specification files are tracked as lint debt rather
# than reformatted in this behaviour-preserving research-agent cleanup pass.
# 2026-07-03: paths re-mapped after the flat modules moved into subpackages
# (concept/, scores/, io/, utils/, runtime/); entries whose debt was actually
# fixed in that pass (F841 dead assignments, E731, F821) were dropped instead
# of re-ignored.
"src/easyicu/cohort_visualization.py" = ["F401"]
"src/easyicu/concept/__init__.py" = ["E402", "E701", "F401"]
"src/easyicu/concept/callbacks.py" = ["E402"]
"src/easyicu/config.py" = ["E402"]
"src/easyicu/datasource.py" = ["E402", "E701", "F401", "F841"]
"src/easyicu/io/export.py" = ["F401"]
"src/easyicu/scores/__init__.py" = ["E701"]
"src/easyicu/scripts/extract_features.py" = ["E701", "F401", "F841"]
"src/easyicu/visualization/*.py" = ["E741", "F401"]
# S102/S107/B017/B018 are test-suite idioms, not defects: `exec` is how the
# research-agent tests run the generated analysis code that is under test.
"tests/**/*.py" = [
    "E402", "E702", "E741", "F401", "F841",
    "S102", "S107", "B017", "B018",
]
"tests/research_agent/core/test_cost.py" = ["F811"]
"tests/research_agent/core/test_skills.py" = ["F821"]
"tests/research_agent/gates/test_validators.py" = ["F821"]
