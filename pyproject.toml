[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easyicu"
version = "1.0.0"
description = "Python toolkit for working with ICU datasets inspired by the R ricu package."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Haibo Zhu and EasyICU contributors" }
]
license = "MIT"
dependencies = [
  "pandas>=1.5",
  "openpyxl>=3.1",
  "pyarrow>=23.0.0",
  "numpy>=1.23",
  "matplotlib>=3.7",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "requests>=2.28",
  "tqdm>=4.65",
  "duckdb>=0.9.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "statsmodels>=0.14",
  "typing-extensions>=4.8"
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "black>=23.0",
  "ruff>=0.1.0",
  "vulture>=2.14",
  "deptry>=0.23",
  "import-linter>=2.13",
  "httpx>=0.27",
  "mcp>=1.28,<2",
  # tests/ read pyproject with tomllib, which is stdlib only from 3.11.
  # requires-python allows 3.10, where three test modules imported it
  # unconditionally and failed the whole matrix leg at collection.
  "tomli>=2.0; python_version < '3.11'"
]
viz = [
  "plotly>=5.15",
  "kaleido>=0.2.1"
]
webapp = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "psutil>=5.9",
  "openai>=1.0",
  "starlette>=0.40",
  "pymupdf>=1.24"
]
llmserver = [
  "fastapi>=0.115",
  "uvicorn>=0.30"
]
agentic = [
  "httpx>=0.27",
  "openai>=1.0",
  "pillow>=10.0",
  "pypdf>=5.0"
]
mcp = [
  "mcp>=1.28,<2",
  "anyio>=4.5",
  "starlette>=0.40",
  "uvicorn>=0.31"
]
cli = [
  "rich>=13.0"
]
# Advanced analytical methods the research-agent sandbox may use. Mirrors
# research_agent/contracts/method_packages.CURATED_METHOD_PACKAGES — the coder is only
# allowed to import a package once it is declared here (reproducible) AND
# importable at run time (verified by the capability probe).
methods = [
  "lifelines>=0.27",
  "numba>=0.59",
  "shap>=0.44",
  "xgboost>=2.0"
]
all = [
  "easyicu[dev,viz,webapp,llmserver,agentic,mcp,cli,methods]"
]

[project.scripts]
easyicu = "easyicu.scripts.extract_features:main"
easyicu-webapp = "easyicu.webserver.__main__:main"
easyicu-llm-server = "easyicu.hosted_llm_server:main"
easyicu-research-agent = "easyicu.research_agent.cli:main"
easyicu-research-replication = "easyicu.research_agent.replication_cli:main"

[project.urls]
Homepage = "https://github.com/shen-lab-icu/easyicu"
Repository = "https://github.com/shen-lab-icu/easyicu.git"
Issues = "https://github.com/shen-lab-icu/easyicu/issues"
Documentation = "https://github.com/shen-lab-icu/easyicu/blob/main/README.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
easyicu = ["data/*.json", "data/research_know_how/*.json"]
"easyicu.webserver" = [
  "static/index.html",
  "static/css/*.css",
  "static/js/*.js",
  "static/vendor/echarts/*"
]
"easyicu.research_agent.providers.prompts" = ["v1/*.txt"]
# The DockerRunner docstring tells users to build the sandbox image from
# src/easyicu/research_agent/runner_image/Dockerfile. Ship it, or that
# instruction is dead for anyone who installed from a wheel.
"easyicu.research_agent" = [
  "runner_image/Dockerfile",
  "runner_image/requirements.lock",
  "runner_image/README.md",
]

[tool.ruff]
target-version = "py310"

[tool.deptry]
# Optional feature groups and developer tools are intentionally not imported
# by the production package. Missing and transitive runtime dependencies remain
# hard failures; only the "declared but unused" report is suppressed.
ignore = ["DEP002"]

[tool.ruff.lint]
# Keep the first project-wide gate conservative while the historical lint
# backlog is retired. This mirrors Ruff's default error-focused families.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Public re-export surface and large transition modules retain compatibility
# imports that are intentionally not referenced inside the defining module.
"src/easyicu/__init__.py" = ["E402", "F401", "F822"]
"src/easyicu/research_agent/__init__.py" = ["E402", "F401", "F822"]
"src/easyicu/research_agent/*.py" = ["E402"]
"src/easyicu/research_agent/**/*.py" = ["E402"]
# Historical F401/F841 debt is pinned to the exact files that contain it.
# New research-agent files receive both rules automatically.
"src/easyicu/research_agent/agents/core.py" = ["F401", "F841"]
"src/easyicu/research_agent/audits/patterns.py" = ["F401"]
"src/easyicu/research_agent/audits/validators.py" = ["F401", "F841"]
"src/easyicu/research_agent/authority/provenance.py" = ["F401"]
"src/easyicu/research_agent/authority/step_runtime.py" = ["F401"]
"src/easyicu/research_agent/authority/typed_input_receipt.py" = ["F401"]
"src/easyicu/research_agent/case_plugins/builder.py" = ["F401"]
"src/easyicu/research_agent/cohort/schema.py" = ["F401"]
"src/easyicu/research_agent/contracts/declared_product.py" = ["F401"]
"src/easyicu/research_agent/contracts/table_one.py" = ["F401"]
"src/easyicu/research_agent/discovery/idea_mining.py" = ["F401"]
"src/easyicu/research_agent/execution/code_hygiene.py" = ["F401"]
"src/easyicu/research_agent/execution/development_sample.py" = ["F401", "F841"]
"src/easyicu/research_agent/execution/phase.py" = ["F401"]
"src/easyicu/research_agent/execution/runners/deterministic_descriptive.py" = ["F401"]
"src/easyicu/research_agent/figures/causal.py" = ["F401"]
"src/easyicu/research_agent/figures/phenotype.py" = ["F401"]
"src/easyicu/research_agent/figures/prediction.py" = ["F401"]
"src/easyicu/research_agent/gates/preflight.py" = ["F401"]
"src/easyicu/research_agent/learning/runtime.py" = ["F401"]
"src/easyicu/research_agent/orchestration/experiment_spec.py" = ["F401"]
"src/easyicu/research_agent/pipeline.py" = ["F401", "F541", "F841"]
"src/easyicu/research_agent/providers/llm.py" = ["F401"]
"src/easyicu/research_agent/providers/mocks.py" = ["F401", "F841"]
"src/easyicu/research_agent/repairs/serialization.py" = ["F841"]
"src/easyicu/research_agent/repairs/source.py" = ["F401"]
"src/easyicu/research_agent/replication/notebook.py" = ["F401"]
"src/easyicu/research_agent/replication/paper.py" = ["F841"]
"src/easyicu/research_agent/reporting/bibtex.py" = ["F401"]
"src/easyicu/research_agent/reporting/latex.py" = ["F401"]
"src/easyicu/research_agent/reporting/reporting_checklist.py" = ["F401"]
"src/easyicu/research_agent/reporting/reviewer.py" = ["F401", "F841"]
"src/easyicu/research_agent/research_context/builder.py" = ["F401"]
"src/easyicu/research_agent/research_context/prompt_scope.py" = ["F401"]
"src/easyicu/research_agent/research_context/typed.py" = ["F401"]
"src/easyicu/research_agent/resources/capability.py" = ["F401"]
"src/easyicu/research_agent/resources/coder.py" = ["F401"]
"src/easyicu/research_agent/robustness/panel.py" = ["F401"]
"src/easyicu/research_agent/robustness/primary_effect.py" = ["F401"]
# Legacy compact callback/specification files are tracked as lint debt rather
# than reformatted in this behaviour-preserving research-agent cleanup pass.
# 2026-07-03: paths re-mapped after the flat modules moved into subpackages
# (concept/, scores/, io/, utils/, runtime/); entries whose debt was actually
# fixed in that pass (F841 dead assignments, E731, F821) were dropped instead
# of re-ignored.
"src/easyicu/cohort_visualization.py" = ["F401"]
"src/easyicu/concept/__init__.py" = ["E402", "E701", "F401"]
"src/easyicu/concept/callbacks.py" = ["E402"]
"src/easyicu/config.py" = ["E402"]
"src/easyicu/datasource.py" = ["E402", "E701", "F401", "F841"]
"src/easyicu/io/export.py" = ["F401"]
"src/easyicu/scores/__init__.py" = ["E701"]
"src/easyicu/scripts/extract_features.py" = ["E701", "F401", "F841"]
"src/easyicu/visualization/*.py" = ["E741", "F401"]
"tests/**/*.py" = ["E402", "E702", "E741", "F401", "F841"]
"tests/research_agent/test_cost.py" = ["F811"]
"tests/research_agent/test_skills.py" = ["F821"]
"tests/research_agent/test_validators.py" = ["F821"]
