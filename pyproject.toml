[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easyicu"
version = "0.2.0"
description = "Python toolkit for working with ICU datasets inspired by the R ricu package."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "ICU Analytics", email = "icu-analytics@example.com" }
]
license = { text = "MIT" }
dependencies = [
  "pandas>=1.5",
  "pyarrow>=11.0",
  "numpy>=1.23",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "requests>=2.28",
  "tqdm>=4.65",
  "duckdb>=0.9.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "black>=23.0",
  "ruff>=0.1.0"
]
viz = [
  "plotly>=5.15",
  "kaleido>=0.2.1"
]
webapp = [
  "streamlit>=1.28",
  "streamlit-echarts>=0.4.0",
  "plotly>=5.15",
  "kaleido>=0.2.1",
  "openpyxl>=3.1",
  "psutil>=5.9",
  "duckdb>=0.9.0",
  "scipy>=1.10",
  "openai>=1.0"
]
llmserver = [
  "fastapi>=0.115",
  "uvicorn>=0.30"
]
all = [
  "easyicu[dev,viz,webapp,llmserver]"
]

[project.scripts]
easyicu = "easyicu.scripts.extract_features:main"
easyicu-webapp = "easyicu.webapp.__main__:main"
easyicu-llm-server = "easyicu.hosted_llm_server:main"

[project.urls]
Homepage = "https://github.com/shen-lab-icu/easyicu"
Repository = "https://github.com/shen-lab-icu/easyicu.git"
Issues = "https://github.com/shen-lab-icu/easyicu/issues"
Documentation = "https://github.com/shen-lab-icu/easyicu/blob/main/README.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
easyicu = ["data/*.json"]
