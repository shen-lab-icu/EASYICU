# pytest配置文件

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 标记定义
# 2026-05 审计: 历史曾声明 4 个 marker, 实际只有 2 个被用上 ——
#   - needs_real_data: 由 tests/conftest.py:pytest_collection_modifyitems
#     做默认跳过, 除非传 --run-real 且 EASYICU_DATA_PATH 指向真实数据库
#   - unit: tests/test_arrow_converter.py 的 pytestmark
# integration 与 slow 曾在 2026-05 因全套零使用而移除。
# 2026-08-17 重新引入, 这次有明确用途并且真的打了标:
#   - slow: 单个测试耗时 >=5s。裸跑 pytest 默认用 addopts 里的 -m "not slow"
#     跳过它们, 让开发循环回到分钟级 (符合 CLAUDE.md 的开发期测试政策:
#     小改动只跑相关测试, 完整套留给 checkpoint)。
#   - integration: 真的驱动 ResearchAgentPipeline (含 analysis.py 子进程) 的
#     端到端测试。这类同时也标 slow。
# 要跑完整套 (CI checkpoint / 冻结前) 用显式空 marker 表达式取消默认过滤:
#     pytest -m ""
# 只看被跳过的那批: pytest -m slow
# 2026-05-27 新增:
#   - needs_real_llm: 真实 LLM 提供商(OpenAI / OpenRouter / Anthropic)才有意义的
#     测试。默认跳过, 需 --run-real-llm 且对应 API key 环境变量存在。仅在 mock 下
#     总是通过的测试不应该标这个 marker —— 它的目的是把"真测试 vs mock-only 自证"
#     在 CI 报告里分开。
# --strict-markers 仍开, 新加 marker 时请先来这里声明。
markers =
    needs_real_data: 需要本地真实ICU数据库路径的测试(默认跳过,需 --run-real + EASYICU_DATA_PATH)
    needs_real_llm: 需要真实 LLM 提供商的测试(默认跳过,需 --run-real-llm + 对应 API key)
    packaging: 需要真实构建/安装 wheel 的打包测试(默认跳过,需 --run-packaging,约 2 分钟)
    unit: 快速单元测试
    slow: 单个测试耗时 >=5s(裸跑 pytest 默认跳过; 用 pytest -m "" 跑全套)
    integration: 真实驱动 ResearchAgentPipeline 的端到端测试(同时标 slow)
    ricu_parity: 与 R ricu 对照的一致性测试(纯逻辑部分总是运行;依赖 ricu CSV 黄金基准的部分在 tests/fixtures/ricu/ 缺失时自动跳过)
    clinical_conformance: 与原始临床定义或权威参考实现锁定的金标准边界测试

# 日志配置
# log_cli 在 13,982 个测试上会刷天量实时日志并拖慢整套; 默认关闭。
# 调单个测试要看实时日志时: pytest <target> -o log_cli=true
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 默认选项
# --verbose 在 13,982 个测试上只是刷屏, 去掉; 要逐条看用 pytest -v。
# -m "not slow" 是开发循环的默认: 见上方 marker 说明, 取消过滤用 pytest -m ""。
addopts =
    --strict-markers
    --tb=short
    --disable-warnings
    -m "not slow"
