# pytest配置文件

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 标记定义
# 2026-05 审计: 历史曾声明 4 个 marker, 实际只有 2 个被用上 ——
#   - needs_real_data: 由 tests/conftest.py:pytest_collection_modifyitems
#     做默认跳过, 除非传 --run-real 且 EASYICU_DATA_PATH 指向真实数据库
#   - unit: tests/test_arrow_converter.py 的 pytestmark
# integration 与 slow 全套零使用, 已移除以避免文档误导。
# --strict-markers 仍开, 新加 marker 时请先来这里声明。
markers =
    needs_real_data: 需要本地真实ICU数据库路径的测试(默认跳过,需 --run-real + EASYICU_DATA_PATH)
    unit: 快速单元测试

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 覆盖率配置
addopts =
    --verbose
    --strict-markers
    --tb=short
    --disable-warnings
