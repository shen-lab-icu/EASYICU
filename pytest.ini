# pytest配置文件

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 标记定义
# 2026-05 审计: 历史曾声明 4 个 marker, 实际只有 2 个被用上 ——
#   - needs_real_data: 由 tests/conftest.py:pytest_collection_modifyitems
#     做默认跳过, 除非传 --run-real 且 EASYICU_DATA_PATH 指向真实数据库
#   - unit: tests/test_arrow_converter.py 的 pytestmark
# integration 与 slow 当时全套零使用, 已移除; 2026-08 起 research_agent
# 的端到端 pipeline 测试已足够多、足够慢, 重新声明为标签 marker:
#   - integration: 真正跑 ResearchAgentPipeline(含子进程 analysis.py)的端到端测试。
#   - slow: 已知会显著拖慢本地反馈的测试(通常是 integration 的子集)。
#   两者默认仍会运行(与 needs_real_* 不同), 本地可用
#   `-m "not integration"` 或 `-m "not slow"` 快速排除。
# 2026-05-27 新增:
#   - needs_real_llm: 真实 LLM 提供商(OpenAI / OpenRouter / Anthropic)才有意义的
#     测试。默认跳过, 需 --run-real-llm 且对应 API key 环境变量存在。仅在 mock 下
#     总是通过的测试不应该标这个 marker —— 它的目的是把"真测试 vs mock-only 自证"
#     在 CI 报告里分开。
# --strict-markers 仍开, 新加 marker 时请先来这里声明。
markers =
    needs_real_data: 需要本地真实ICU数据库路径的测试(默认跳过,需 --run-real + EASYICU_DATA_PATH)
    needs_real_llm: 需要真实 LLM 提供商的测试(默认跳过,需 --run-real-llm + 对应 API key)
    packaging: 需要真实构建/安装 wheel 的打包测试(默认跳过,需 --run-packaging,约 2 分钟)
    unit: 快速单元测试
    ricu_parity: 与 R ricu 对照的一致性测试(纯逻辑部分总是运行;依赖 ricu CSV 黄金基准的部分在 tests/fixtures/ricu/ 缺失时自动跳过)
    clinical_conformance: 与原始临床定义或权威参考实现锁定的金标准边界测试
    integration: 跑真实 ResearchAgentPipeline(含子进程 analysis.py)的端到端测试
    slow: 已知显著拖慢本地反馈的测试(通常是 integration 的子集)

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 覆盖率配置
addopts =
    --verbose
    --strict-markers
    --tb=short
    --disable-warnings
